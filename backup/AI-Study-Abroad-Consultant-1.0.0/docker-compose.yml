services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studyabroad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/studyabroad
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models
      SENTENCE_TRANSFORMERS_HOME: /models
      BGE_EMBED_MODEL_PATH: /models/hub/models--BAAI--bge-m3
      BGE_RERANKER_MODEL_PATH: /models/hub/models--BAAI--bge-reranker-v2-m3
      CRAWLER_DATA_DIR: /app/crawler/data
    volumes:
      - hf_models:/models
      - ./crawler/data:/app/crawler/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  hf_models:
